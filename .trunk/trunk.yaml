# =============================================================================
# Trunk.io configuration (schema v0.1)
# =============================================================================
# Reference: https://raw.githubusercontent.com/trunk-io/configs/main/.trunk/trunk.yaml
# trunk CLI:  v1.25.x (installed by trunk-io/trunk-action@04ba50e7)
#
# This repo is a Rust workspace (phenoAI), so only Rust-relevant plugins are
# enabled. Linters for other languages (prettier, eslint, mypy, ruff, etc.)
# were removed because the codebase has no matching source files to lint;
# leaving them enabled would cause every CI run to flag missing config files.
# =============================================================================

version: 0.1

cli:
  version: 1.25.0

plugins:
  sources:
    - id: trunk
      ref: v1.9.0
      uri: https://github.com/trunk-io/plugins
    - id: configs
      ref: v1.2.1
      uri: https://github.com/trunk-io/configs

lint:
  # Only medium+ findings block `trunk check`. Trunk reports all findings
  # regardless; this just sets which severity level fails CI.
  threshold:
    - linters: [ALL]
      level: medium

  # Linter names listed here come from the `trunk` and `configs` plugin
  # registries above. Linters are identified by NAME ONLY (no @version),
  # because trunk CLI resolves versions internally from each plugin source.
  enabled:
    - actionlint    # .github/workflows/*.yml
    - clippy        # src/ + tests/ in every crate
    - shellcheck    # *.sh scripts in CI workflows
    - taplo         # Cargo.toml + *.toml
    - yamllint      # .github/workflows/*.yml + .trunk/trunk.yaml
    - rustfmt       # src/ + tests/ in every crate

actions:
  enabled:
    - trunk-announce
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
