[package]
name = "phenocompose-port-secret"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Phenotype Compose SecretStore port trait — the canonical hex-architecture port for storing, retrieving, listing, and deleting versioned secrets. Adapters implement SecretStore to bridge to local secret backends (in-memory map, JSON file, vault, k8s secrets, ...)."
publish = false
repository = "https://github.com/KooshaPari/PhenoCompose"
documentation = "https://docs.rs/phenocompose-port-secret"
keywords = ["phenotype", "pheno-compose", "port", "secret"]
categories = ["development-tools"]
authors = ["kooshapari"]

[lib]
path = "src/lib.rs"

[dependencies]
phenocompose-port-types = { path = "../pheno-compose-port-types" }
thiserror = "2.0"

[dev-dependencies]
tempfile = "3"
