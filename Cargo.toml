# PhenoAI - AI/LLM Agent Workspace
#
# Consolidated workspace containing:
# - llm-router: LLM routing via substrate::omniroute-adapter
# - mcp-server: MCP protocol server
# - pheno-embedding: Embedding pipeline
# - eidolon-*: Agent runtime, desktop, mobile, sandbox
# - phenotype-error-core: Shared error types
# - phenotype-router: A2A router decision layer
# - nexus: Service discovery
# - sidekick-*: Agent messaging, observability, dispatch
# - pheno-compose-*: Deployment composition, plugins, ports
# - pheno-config: Configuration loading
# - phench: Python benchmarking CLI (non-Cargo)
[workspace]
members = [
    # === Core AI crates ===
    "crates/llm-router",
    "crates/mcp-server",
    "crates/pheno-embedding",
    "crates/eidolon-core",
    "crates/eidolon-desktop",
    "crates/eidolon-mobile",
    "crates/eidolon-sandbox",
    "crates/phenotype-error-core",

    # === Router + Service Discovery ===
    "crates/phenotype-router",
    "crates/nexus",

    # === Sidekick (agent utilities) ===
    "crates/sidekick-messaging",
    "crates/sidekick-obs-core",
    "crates/sidekick-observability",

    # === PhenoCompose (deployment composition) ===
    "crates/pheno-compose-agentctl",
    "crates/pheno-compose-apple-container-adapter",
    "crates/pheno-compose-i18n",
    "crates/pheno-compose-pheno-config",
    "crates/pheno-compose-phenocompose-cli",
    "crates/pheno-compose-plugin-api",
    "crates/pheno-compose-plugin-sample",
    "crates/pheno-compose-wslc-adapter",
    "crates/pheno-compose-port-composer",
    "crates/pheno-compose-port-di",
    "crates/pheno-compose-port-publisher",
    "crates/pheno-compose-port-runtime",
    "crates/pheno-compose-port-secret",
    "crates/pheno-compose-port-types",
    "crates/pheno-compose-secret-file-adapter",

    # === Gateway (PR #105) ===
    "crates/gateway",
    "crates/pheno-capacity",
]
resolver = "3"

[workspace.package]
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
tokio = { version = "1.44", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
async-trait = "0.1"

# Substrate superset — single source of truth for routing logic
substrate = { git = "https://github.com/KooshaPari/substrate", branch = "main" }
