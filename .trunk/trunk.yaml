# =============================================================================
# Trunk.io — Plugin versions for linting/formatting tools
# =============================================================================
# This file is auto-generated. Run `trunk upgrade` to update.
# https://docs.trunk.io/check/reference
#
# Restored for trunk CLI v1.22.x / trunk-action v1.3.1.
# v1.22.x schema requires the `version: 0.1` field and rejects:
#   - top-level `linters:`/`formatters:` (must live inside each plugin block)
#   - top-level `actions.{trunk-check,trunk-merge,trunk-push}`
#   - top-level `cache:` (cache is configured via action inputs, not the config file)
#   - top-level `cli:`/`env:` (use environment variables / GitHub secrets)
# Plugins are now declared explicitly per linter/formatter and each one
# can carry its own `enabled`, `run`, and direct_configs fields.
# =============================================================================

version: 0.1

cli:
  version: 1.25.0

plugins:
  sources:
    - id: trunk
      ref: v1.2.2
    - id: community
      ref: main

  # ---- Linters ----
  actionlint:
    enabled: true
    commands:
      - name: actionlint
        run: actionlint ${target}
    direct_configs:
      - .github/workflows/*.yml
  black:
    enabled: true
    commands:
      - name: black
        run: black --check --line-length 100 ${target}
    direct_configs:
      - pyproject.toml
      - ruff.toml
  clippy:
    enabled: true
    commands:
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
  eslint:
    enabled: true
    direct_configs:
      - .eslintrc.*
      - eslint.config.*
  golangci-lint:
    enabled: true
    direct_configs:
      - .golangci.yml
      - .golangci.yaml
  mypy:
    enabled: true
    commands:
      - name: mypy
        run: mypy --ignore-missing-imports ${target}
  ruff:
    enabled: true
    commands:
      - name: ruff
        run: ruff check --output-format=github ${target}
    direct_configs:
      - ruff.toml
      - pyproject.toml
  shellcheck:
    enabled: true
  taplo:
    enabled: true
  yamllint:
    enabled: true

  # ---- Formatters ----
  prettier:
    enabled: true
    direct_configs:
      - .prettierrc
      - prettier.config.*
  rustfmt:
    enabled: true
    commands:
      - name: rustfmt
        run: rustfmt ${target}
