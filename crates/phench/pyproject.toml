[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phench"
version = "0.1.0"
description = "Phenotype project-state runtime control plane"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "orjson>=3.10",
]

[project.scripts]
phench = "phench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
