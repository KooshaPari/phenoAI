[package]
name = "phenocompose-apple-container-adapter"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Apple container CLI Runtime adapter for the phenocompose-port-runtime port."
publish = false
repository = "https://github.com/KooshaPari/PhenoCompose"
documentation = "https://docs.rs/phenocompose-apple-container-adapter"
keywords = ["phenotype", "pheno-compose", "adapter", "runtime", "container"]
categories = ["development-tools"]
authors = ["kooshapari"]

[lib]
path = "src/lib.rs"

[dependencies]
phenocompose-port-runtime = { path = "../pheno-compose-port-runtime" }
phenocompose-port-types = { path = "../pheno-compose-port-types" }
