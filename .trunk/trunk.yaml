# =============================================================================
# Trunk.io — Plugin versions for linting/formatting tools
# =============================================================================
# Schema: v0.1 (trunk CLI v1.25.x / trunk-action v1.3.1)
# Reference: trunk-io/trunk-action/.trunk/trunk.yaml @ 04ba50e7
#
# This repo is a Rust workspace (phenoAI), so we only enable Rust-relevant
# plugins. Other linters (actionlint, prettier, eslint, mypy, ruff, etc.)
# were removed because the codebase has no matching source files to lint;
# leaving them enabled would cause every CI run to flag missing
# direct_configs files.
# =============================================================================

version: 0.1

cli:
  version: 1.25.0

plugins:
  sources:
    - id: trunk
      ref: v1.2.2
    - id: community
      ref: main

  # ---- Linters ----
  actionlint:
    enabled: true
    commands:
      - name: actionlint
        run: actionlint ${target}
    direct_configs:
      - .github/workflows/*.yml
  clippy:
    enabled: true
    commands:
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
  shellcheck:
    enabled: true
  taplo:
    enabled: true
  yamllint:
    enabled: true

  # ---- Formatters ----
  rustfmt:
    enabled: true
    commands:
      - name: rustfmt
        run: rustfmt ${target}

lint:
  # Only medium+ findings block `trunk check`. Trunk reports all findings
  # regardless; this just sets which severity level fails CI.
  threshold:
    - linters: [ALL]
      level: medium

actions:
  enabled:
    - trunk-announce
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
