[package]
name = "kmobile-mcp"
version = "0.1.0"
edition = "2021"
description = "KMobile MCP server (Model Context Protocol)"
license = "MIT"

[[bin]]
name = "kmobile-mcp"
path = "src/main.rs"

[dependencies]
kmobile-core = { path = "../kmobile-core" }
kmobile = { path = "../.." }
clap = { version = "4.4", features = ["derive", "env"] }
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmcp = { version = "1.7", features = ["server", "macros", "transport-io"] }
schemars = "1.2"
