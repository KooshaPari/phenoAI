[package]
name = "kmobile-cli"
version = "0.1.0"
edition = "2021"
description = "KMobile CLI binary"
license = "MIT"

# `kmobile-cli` is a transitional crate kept around for the in-progress
# hexagonal refactor (see AGENTS.md). The real `kmobile` binary is owned by
# the root crate, so this placeholder binary is renamed to avoid a
# duplicate-target collision during `cargo build --workspace`.
[[bin]]
name = "kmobile-cli-stub"
path = "src/main.rs"

[dependencies]
kmobile-core = { path = "../kmobile-core" }

# CLI and configuration
clap = { version = "4.4", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }
