reqwest = { version = "0.13", features = ["json", "rustls"] }

# LanceDB-backed vector store
lancedb = "0.33"
arrow-array = "59"
arrow-schema = "59"
futures = "0.3"

[dev-dependencies]
tempfile = "3"
