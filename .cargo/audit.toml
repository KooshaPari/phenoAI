# cargo-audit configuration for phenoAI
#
# Added in support of PR #103 (fix(ci): repair 3 orphan SHA pins).
# See https://github.com/KooshaPari/phenoAI/pull/103 for the upstream audit workflow
# fix that surfaced these vulns; this config ignores the advisory that has
# no upstream patched release available at the time of writing.
#
# (RUSTSEC-2026-0221 / event-listener was previously listed here but is not
# present in the current dependency tree after the lancedb 0.38 + h2 0.4.16
# bump; the leftover entry would emit a `advisory-not-detected` warning on
# every cargo-audit run, so it is removed. If event-listener reappears in a
# future transitive bump, restore the ignore with a fresh cargo tree lookup.)

[advisories]
ignore = [
  # RUSTSEC-2024-0436: paste 1.0.15 — soundness issue, no patched release available
  # (per https://rustsec.org/advisories/RUSTSEC-2024-0436.html "no patched versions").
  # Pulled in transitively by lancedb -> lance-bitpacking -> lance-encoding.
  # Tracking: https://github.com/tokio-rs/paste/issues
  "RUSTSEC-2024-0436",
]
